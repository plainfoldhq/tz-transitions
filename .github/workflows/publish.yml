name: publish-pypi
# Publishes dst-test-vectors to PyPI with Trusted Publishing (no token stored) when the
# version in pyproject.toml changes on main, or when run by hand. skip-existing: a metadata-only
# edit to pyproject.toml re-runs this without failing on the already-uploaded version.
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build tzdata==2026.6 && python -m build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONTZPATH: ""
          PYTHONPATH: src
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
